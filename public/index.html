<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" href="/images/favicon.ico" sizes="any">
    <title>Production Photos</title>
  </head>
  <body>
    <header class="site-header">
        <a href="/" class="logo-link" aria-label="Go to homepage">
            <img class="company-logo" src="/images/verano.svg" alt="Verano logo">
        </a>
        <a href="/" class="moment-logo-link" aria-label="Go to homepage">
            <img class="moment-logo" src="/images/make-this-your-moment.svg" alt="Moment logo">
        </a>
        <div class="header-text">
            <p class="header-title">Production Photos Archive</p>
        </div>
    </header>
    <main>
      <form id="search-form">
        <label for="search">Search images</label>
        <input id="search" name="search" type="search" autofocus>
        <button id="search-button" type="submit">Search</button>
      </form>
      <section id="search-history-section" class="search-history">
        <div class="search-history-header">
          <h2>Recent searches:</h2>
          <div id="search-history">
            <button id="today-button" class="search-history-term" type="submit" form="search-form" aria-pressed="false">Today</button>
          </div>
          <button id="clear-history" aria-label="Clear search history">Clear</button>
        </div>
      </section>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="gallery"></div>
    </main>
    <footer class="site-footer">
        <p>© 2026 Verano - For internal use only - Website by Joeri Zwamborn</p>
    </footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
